services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
    networks:
      - access_network
      - autokore-network
      - lilop-network
      - dev-qa-network

networks:
  access_network:
    external: true
  autokore-network:
    external: true
  lilop-network:
    external: true
  dev-qa-network:
    external: true
