services:
  autokore-site:
    container_name: autokore-site
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ./demo.conf:/etc/nginx/conf.d/demo.conf
      - ./html:/usr/share/nginx/html
    expose:
      - "80"
    networks:
      - autokore-network

networks:
  autokore-network:
    external: true
