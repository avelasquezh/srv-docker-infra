services:
  dev-qa-n8n:
    image: n8nio/n8n:latest
    container_name: dev-qa-n8n
    environment:
      - N8N_PORT=5678
      - N8N_HOST=n8n.dev-qa.online
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://n8n.dev-qa.online
      - WEBHOOK_URL=https://n8n.dev-qa.online/
      - N8N_SECURE_COOKIE=true
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
    volumes:
      - ./data:/home/node/.n8n
    restart: unless-stopped
    expose:
      - "5678"
    networks:
      - dev-qa-network

networks:
  dev-qa-network:
    external: true
