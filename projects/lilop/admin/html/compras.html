<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compras — Lilop Admin</title>
  <link rel="stylesheet" href="/assets/css/tokens.css"/>
  <link rel="stylesheet" href="/assets/css/admin.css?v=2"/>
  <link rel="stylesheet" href="/assets/css/utilities.css?v=1"/>
  <link rel="stylesheet" href="/assets/css/responsive.css?v=1"/>
  <style>
    /* ── Tarjeta de producto ── */
    .compra-card {
      background: var(--color-white);
      border-radius: var(--r-lg);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-xs);
      overflow: hidden;
      transition: box-shadow var(--duration-base) var(--ease);
    }
    .compra-card:hover { box-shadow: var(--shadow-sm); }

    .compra-card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--s-4) var(--s-6);
      border-bottom: 1px solid var(--color-border);
      gap: var(--s-4);
      flex-wrap: wrap;
    }

    .compra-card__meta {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      flex-wrap: wrap;
    }

    .compra-card__producto {
      font-family: var(--font-display);
      font-size: var(--text-md);
      font-weight: var(--weight-semibold);
      color: var(--color-text);
    }

    .compra-card__badge {
      display: inline-flex;
      align-items: center;
      gap: var(--s-1);
      padding: 2px var(--s-3);
      border-radius: var(--r-pill);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
    }

    .badge--pedido {
      background: var(--color-soft);
      color: var(--color-violet);
    }

    .badge--cliente {
      background: var(--color-mist-blue);
      color: var(--color-blue-deep);
    }

    .badge--urgente {
      background: var(--color-error-bg);
      color: var(--color-error);
    }

    .badge--proximo {
      background: var(--color-warning-bg);
      color: #92400e;
    }

    .badge--normal {
      background: var(--color-success-bg);
      color: #166534;
    }

    .compra-card__entrega {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      gap: var(--s-1);
    }

    /* ── Progreso de compras ── */
    .compra-progress {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      padding: var(--s-3) var(--s-6);
      background: var(--color-fog);
      border-bottom: 1px solid var(--color-border);
    }

    .compra-progress__bar {
      flex: 1;
      height: 6px;
      background: var(--color-border);
      border-radius: var(--r-pill);
      overflow: hidden;
    }

    .compra-progress__fill {
      height: 100%;
      border-radius: var(--r-pill);
      background: var(--grad-primary);
      transition: width var(--duration-slow) var(--ease);
    }

    .compra-progress__label {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    /* ── Lista de compras ── */
    .compras-list {
      padding: var(--s-4) var(--s-6);
      display: flex;
      flex-direction: column;
      gap: var(--s-3);
    }

    .compra-row {
      display: grid;
      grid-template-columns: 1fr 1fr 80px 100px 100px 110px 90px auto;
      gap: var(--s-3);
      align-items: center;
      padding: var(--s-3) var(--s-4);
      background: var(--color-fog);
      border-radius: var(--r-sm);
      border: 1px solid transparent;
      transition: border-color var(--duration-fast);
    }

    .compra-row:hover { border-color: var(--color-border); }

    .compra-row--comprado {
      background: var(--color-success-bg);
      border-color: rgba(34, 197, 94, 0.2);
      opacity: 0.85;
    }

    .compra-row__label {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin-bottom: 2px;
    }

    .compra-row__val {
      font-size: var(--text-sm);
      color: var(--color-text);
      font-weight: var(--weight-medium);
    }

    /* ── Cabecera de columnas ── */
    .compras-list__header {
      display: grid;
      grid-template-columns: 1fr 1fr 80px 100px 100px 110px 90px auto;
      gap: var(--s-3);
      padding: 0 var(--s-4);
      margin-bottom: var(--s-1);
    }

    .compras-list__header span {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--color-text-light);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── Formulario nueva compra ── */
    .compra-form {
      display: grid;
      grid-template-columns: 1fr 1fr 80px 100px 100px 110px 90px auto;
      gap: var(--s-3);
      align-items: end;
      padding: var(--s-4);
      background: var(--color-soft);
      border-radius: var(--r-sm);
      border: 1px dashed var(--color-lilac);
      margin-top: var(--s-2);
    }

    .compra-form .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .compra-form .form-group label {
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      color: var(--color-text-muted);
    }

    .compra-form input,
    .compra-form select {
      width: 100%;
      padding: var(--s-2) var(--s-3);
      border: 1px solid var(--color-border);
      border-radius: var(--r-xs);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--color-text);
      background: var(--color-white);
      transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
    }

    .compra-form input:focus,
    .compra-form select:focus {
      outline: none;
      border-color: var(--color-lavender);
      box-shadow: var(--shadow-focus);
    }

    /* ── Footer de tarjeta ── */
    .compra-card__footer {
      padding: var(--s-3) var(--s-6);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .compra-card__total {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    .compra-card__total strong {
      color: var(--color-violet);
      font-family: var(--font-display);
    }

    /* ── Estado badge ── */
    .estado-compra {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px var(--s-2);
      border-radius: var(--r-pill);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      cursor: pointer;
      border: none;
      transition: opacity var(--duration-fast);
    }

    .estado-compra--pendiente {
      background: var(--color-warning-bg);
      color: #92400e;
    }

    .estado-compra--comprado {
      background: var(--color-success-bg);
      color: #166534;
    }

    .estado-compra:hover { opacity: 0.8; }

    /* ── Empty state ── */
    .compras-empty {
      text-align: center;
      padding: var(--s-12) var(--s-6);
      color: var(--color-text-muted);
    }

    .compras-empty svg {
      width: 48px;
      height: 48px;
      stroke: var(--color-lilac);
      margin-bottom: var(--s-4);
    }

    /* ── Filtros rápidos ── */
    .filter-pills {
      display: flex;
      gap: var(--s-2);
      flex-wrap: wrap;
    }

    .filter-pill {
      padding: var(--s-2) var(--s-4);
      border-radius: var(--r-pill);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      border: 1px solid var(--color-border);
      background: var(--color-white);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all var(--duration-fast);
    }

    .filter-pill.is-active,
    .filter-pill:hover {
      background: var(--color-violet);
      color: var(--color-white);
      border-color: var(--color-violet);
    }

    /* ── Responsive ── */
    @media (max-width: 1100px) {
      .compras-list__header,
      .compra-row,
      .compra-form {
        grid-template-columns: 1fr 1fr 80px 90px 90px;
      }
      .compra-row > *:nth-child(n+6),
      .compra-form > *:nth-child(n+6),
      .compras-list__header > *:nth-child(n+6) {
        display: none;
      }
    }
  </style>
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
  <header class="admin-topbar" id="adminTopbar"></header>

  <main class="admin-content">

    <!-- Header -->
    <div class="d-flex items-center justify-between mb-6 flex-wrap gap-4">
      <div>
        <h2 class="font-display text-xl font-semibold">Compras</h2>
        <p class="text-sm text-muted" style="margin-top:4px" id="comprasCount"></p>
      </div>
    </div>

    <!-- Filtros -->
    <div class="admin-panel mb-5">
      <div class="admin-panel__body p-4-6">
        <div class="d-flex gap-4 flex-wrap items-center">
          <div class="pos-relative flex-1" style="min-width:200px">
            <svg class="size-15 pos-absolute text-light" style="left:12px;top:50%;transform:translateY(-50%)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="search" class="form-input" id="searchCompras" placeholder="Buscar por cliente, pedido, producto..." style="padding-left:36px;"/>
          </div>
          <div class="filter-pills" id="filterPills">
            <button class="filter-pill is-active" data-filter="todos">Todos</button>
            <button class="filter-pill" data-filter="por_comprar">Por comprar</button>
            <button class="filter-pill" data-filter="comprado">Comprado</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Lista de productos -->
    <div class="d-flex flex-col gap-4" id="comprasContainer"></div>

    <!-- Empty state global -->
    <div class="d-none" id="emptyGlobal">
      <div class="compras-empty admin-panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <p class="text-md font-semibold mb-2">Sin productos pendientes</p>
        <p class="text-sm">Todos los productos tienen sus compras al día</p>
      </div>
    </div>

  </main>
</div>

<!-- Datalists para autocompletado -->
<datalist id="dl-conceptos"></datalist>
<datalist id="dl-proveedores"></datalist>
<datalist id="dl-disenos"></datalist>

<!-- Toast -->
<div class="admin-toasts" id="adminToasts"></div>

<!-- Scripts -->
<script src="/assets/js/admin-auth.js"></script>
<script src="/assets/js/admin-store.js"></script>
<script src="/assets/js/admin-layout.js?v=11"></script>
<script src="/assets/js/admin-ui.js"></script>
<script src="/assets/js/admin-api.js"></script>
<script src="/assets/js/pages/compras.js"></script>

</body>
</html>
