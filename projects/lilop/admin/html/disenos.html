<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diseños — Lilop Admin</title>
  <link rel="stylesheet" href="/assets/css/tokens.css"/>
  <link rel="stylesheet" href="/assets/css/admin.css?v=2"/>
  <link rel="stylesheet" href="/assets/css/responsive.css"/>
  <style>
    .diseno-card { background:var(--color-white);border:1px solid var(--color-border);border-radius:var(--r-xl);overflow:hidden;transition:all var(--duration-base) var(--ease);cursor:pointer; }
    .diseno-card:hover { transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--color-lilac); }
    .diseno-card__img { width:100%;aspect-ratio:1;background:var(--color-fog);overflow:hidden;position:relative; }
    .diseno-card__img img { width:100%;height:100%;object-fit:cover;transition:transform 0.5s; }
    .diseno-card:hover .diseno-card__img img { transform:scale(1.06); }
    .diseno-card__no-img { width:100%;height:100%;display:flex;align-items:center;justify-content:center; }
    .diseno-card__info { padding:var(--s-4); }
    .diseno-card__col { font-size:var(--text-xs);font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-violet);margin-bottom:4px; }
    .diseno-card__name { font-family:var(--font-display);font-size:var(--text-base);font-weight:600;margin-bottom:var(--s-3); }
    .diseno-card__actions { display:flex;gap:var(--s-2); }
    .upload-zone { border:2px dashed var(--color-lilac);border-radius:var(--r-xl);padding:var(--s-12) var(--s-6);text-align:center;cursor:pointer;transition:all var(--duration-base) var(--ease);background:var(--color-fog); }
    .upload-zone:hover { border-color:var(--color-violet);background:var(--color-soft); }
    .upload-zone__icon { width:56px;height:56px;border-radius:var(--r-lg);background:var(--color-soft);display:flex;align-items:center;justify-content:center;margin:0 auto var(--s-4); }
    .upload-zone__icon svg { width:26px;height:26px;color:var(--color-violet); }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
  <header class="admin-topbar" id="adminTopbar"></header>
  <main class="admin-content">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s-6);flex-wrap:wrap;gap:var(--s-4);">
      <div>
        <h2 style="font-family:var(--font-display);font-size:var(--text-xl);font-weight:var(--weight-semibold);">Gestión de Diseños</h2>
        <p style="font-size:var(--text-sm);color:var(--color-text-muted);margin-top:4px;" id="disenosCount"></p>
      </div>
      <button class="btn btn--primary" id="btnNuevoDiseno">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Agregar diseño
      </button>
    </div>

    <!-- Filtros -->
    <div class="admin-panel" style="margin-bottom:var(--s-6);">
      <div class="admin-panel__body" style="padding:var(--s-4) var(--s-6);">
        <div style="display:flex;gap:var(--s-4);flex-wrap:wrap;align-items:center;">
          <div style="position:relative;flex:1;min-width:200px;">
            <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--color-text-light);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="search" class="form-input" id="searchDisenos" placeholder="Buscar diseño..." style="padding-left:36px;"/>
          </div>
          <select class="form-input" id="filterCatalogo" style="max-width:200px;">
            <option value="">Todos los catálogos</option>
            <option value="adulto_diseno">Adulto — Diseño</option>
            <option value="adulto_unicolor">Adulto — Unicolor</option>
            <option value="nino">Niño</option>
            <option value="nina">Niña</option>
          </select>
          <select class="form-input" id="filterProducto" style="max-width:200px;">
            <option value="">Todos los productos</option>
          </select>
          <select class="form-input" id="filterEstado" style="max-width:160px;">
            <option value="">Todos los estados</option>
            <option value="Disponible">Disponible</option>
            <option value="Agotado">Agotado</option>
          </select>
        </div>
        <div id="activeFilters" style="display:none;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-3);"></div>
      </div>
    </div>

    <!-- Grid de diseños -->
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s-5);" id="disenosGrid"></div>

  </main>
</div>

<!-- Modal Diseño -->
<div class="modal-overlay" id="modalDiseno" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal__header">
      <h3 class="modal__title" id="modalDisenoTitle">Agregar diseño</h3>
      <button class="modal__close" data-modal-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal__body">
      <div class="form-group">
        <label class="form-label form-label--required">Nombre del diseño</label>
        <input class="form-input" id="dNombre" placeholder="Ej: Flores rosadas"/>
      </div>
      <div class="form-group">
        <label class="form-label form-label--required">Catálogo</label>
        <select class="form-input" id="dCatalogo">
          <option value="adulto_diseno">Adulto — Diseño</option>
          <option value="adulto_unicolor">Adulto — Unicolor</option>
          <option value="nino">Niño</option>
          <option value="nina">Niña</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Imagen</label>
        <input type="file" class="form-input" id="dImagenFile" accept="image/jpeg,image/png,image/webp"/>
        <span style="font-size:var(--text-xs);color:var(--color-text-muted);">JPG, PNG o WebP — máximo 5MB</span>
      </div>
      <div class="form-group">
        <label class="form-label">Estado</label>
        <select class="form-input" id="dEstado">
          <option value="Disponible">Disponible</option>
          <option value="Agotado">Agotado</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Aplica para</label>
        <div id="dProductosChecks" style="display:flex;flex-wrap:wrap;gap:var(--s-3);padding:var(--s-3);background:var(--color-fog);border-radius:var(--r-md);border:1px solid var(--color-border);">
          <span style="font-size:var(--text-xs);color:var(--color-text-muted);">Cargando...</span>
        </div>
      </div>
      <div id="dPreview" style="display:none;">
        <img id="dPreviewImg" style="width:100%;max-height:200px;object-fit:cover;border-radius:var(--r-lg);border:1px solid var(--color-border);" alt="Preview"/>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost btn--sm" data-modal-close>Cancelar</button>
      <button class="btn btn--primary btn--sm" id="btnGuardarDiseno">Guardar</button>
    </div>
  </div>
</div>

<div class="admin-toasts" id="adminToasts"></div>
<script src="/assets/js/admin-auth.js"></script>
  <script src="/assets/js/admin-api.js"></script>
<script src="/assets/js/admin-store.js"></script>
<script src="/assets/js/admin-layout.js?v=11"></script>
<script src="/assets/js/admin-ui.js?v=3"></script>
<script src="/assets/js/pages/disenos.js?v=16"></script>
</body>
</html>
