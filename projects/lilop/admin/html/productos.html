<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Productos — Lilop Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"/>
  
  <link rel="stylesheet" href="/assets/css/tokens.css"/>
  <link rel="stylesheet" href="/assets/css/admin.css?v=9"/>
  <link rel="stylesheet" href="/assets/css/utilities.css?v=3"/>
  <link rel="stylesheet" href="/assets/css/responsive.css?v=6"/>
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
  <header class="admin-topbar" id="adminTopbar"></header>

  <main class="admin-content">

    <div class="d-flex items-center justify-between mb-6 flex-wrap gap-4">
      <div>
        <h2 class="font-display text-xl font-semibold">Gestión de Productos</h2>
        <p class="text-sm text-muted" style="margin-top:4px" id="productosCount"></p>
      </div>
      <button class="btn btn--primary" id="btnNuevoProducto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nuevo producto
      </button>
    </div>

    <!-- Filtros -->
    <div class="admin-panel mb-6">
      <div class="admin-panel__body p-4-6">
        <div class="d-flex gap-4 flex-wrap items-center">
          <div class="pos-relative flex-1" style="min-width:200px">
            <svg class="size-15 pos-absolute text-light" style="left:12px;top:50%;transform:translateY(-50%)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="search" class="form-input" id="searchProductos" placeholder="Buscar productos..." style="padding-left:36px;"/>
          </div>
          <select class="form-input" id="filterCategoria" style="max-width:180px;">
            <option value="">Todas las categorías</option>
          </select>
          <select class="form-input" id="filterEstadoP" style="max-width:160px;">
            <option value="">Todos</option>
            <option value="active">Activos</option>
            <option value="inactive">Inactivos</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Grid de productos -->
    <div class="d-grid gap-5" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))" id="productosGrid"></div>
    <div class="pagination radius-xl mt-4 p-4-6" id="productosPagination" style="background:var(--color-white);border:1px solid var(--color-border)"></div>

  </main>
</div>

<!-- Modal Producto -->
<div class="modal-overlay" id="modalProducto" role="dialog" aria-modal="true">
  <div class="modal modal--lg">
    <div class="modal__header">
      <h3 class="modal__title" id="modalProductoTitle">Nuevo producto</h3>
      <button class="modal__close" data-modal-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal__body" id="modalProductoBody"></div>
    <div class="modal__footer">
      <button class="btn btn--ghost btn--sm" data-modal-close>Cancelar</button>
      <button class="btn btn--primary btn--sm" id="btnGuardarProducto">Guardar</button>
    </div>
  </div>
</div>

<div class="admin-toasts" id="adminToasts"></div>

<script src="/assets/js/admin-auth.js?v=e12b3a5f"></script>
<script src="/assets/js/admin-api.js?v=dfeefe29"></script>
<script src="/assets/js/admin-layout.js?v=79fc7f0b"></script>
<script src="/assets/js/admin-ui.js?v=b1bbcb09"></script>
<script src="/assets/js/pages/productos.js?v=b1d87e1d"></script>

</body>
</html>
