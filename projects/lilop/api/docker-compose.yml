services:
  api:
    image: node:20-alpine
    container_name: lilop-api
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    command: sh -c "npm install && node src/index.js"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=lilop
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - DOMICILIO_WEBHOOK_URL=https://n8n.autokore.space/webhook/envwdomlilop
      - CORS_ORIGIN=https://lilop.store,https://admin.lilop.store
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - lilop-network
      - lilop-backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  lilop-network:
    external: true
  lilop-backend-network:
    external: true
