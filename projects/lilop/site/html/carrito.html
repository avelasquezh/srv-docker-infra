<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Revisa tu carrito de compras en Lilop y procede al pago de forma segura." />
  <title>Carrito — Lilop</title>

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/global.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages/carrito.css" />
</head>
<body>

  <!-- Componentes globales -->
  <lilop-navbar></lilop-navbar>
  <lilop-cart></lilop-cart>
  <lilop-toast></lilop-toast>
  <div class="overlay" id="mainOverlay" aria-hidden="true"></div>

  <!-- ── HEADER ─────────────────────────────────────────── -->
  <section class="cart-page-hero">
    <div class="container">
      <nav class="cart-page-hero__breadcrumb" aria-label="Ruta de navegación">
        <a href="/index.html">Inicio</a>
        <span aria-hidden="true">›</span>
        <span aria-current="page">Carrito</span>
      </nav>
      <h1 class="cart-page-hero__title">Tu carrito</h1>
      <p class="cart-page-hero__count" id="cartPageCount" aria-live="polite"></p>
    </div>
  </section>

  <!-- ── LAYOUT PRINCIPAL ───────────────────────────────── -->
  <div class="container">
    <div class="cart-page-layout" id="cartPageLayout">

      <!-- ITEMS -->
      <div class="cart-items-section" id="cartItemsSection">
        <!-- Inyectado por carrito.js -->
      </div>

      <!-- RESUMEN (solo visible con items) -->
      <aside class="order-summary" id="orderSummary" aria-label="Resumen de tu pedido" style="display:none;">
        <div class="order-summary__header">
          <h2 class="order-summary__title">Resumen del pedido</h2>
        </div>

        <div class="order-summary__body">
          <div class="order-summary__row">
            <span id="summaryItemsLabel">Productos</span>
            <span id="summarySubtotal"></span>
          </div>
          <div class="order-summary__row">
            <span>Envío</span>
            <span id="summaryShipping">Por calcular</span>
          </div>
          <div class="order-summary__row order-summary__row--total">
            <span>Total</span>
            <span class="order-summary__total-amount" id="summaryTotal"></span>
          </div>

          <div class="order-summary__shipping-note" id="summaryFreeShipping" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            ¡Envío gratis aplicado!
          </div>

          <div class="order-summary__shipping-note" id="summaryShippingProgress" style="display:none;background:var(--color-info-bg);color:var(--color-blue-deep);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round"/>
            </svg>
            <span id="summaryProgressText"></span>
          </div>
        </div>

        <div class="order-summary__footer">
          <a href="/checkout.html" class="btn btn--primary btn--full" id="checkoutBtn" aria-label="Proceder al pago">
            Proceder al pago
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round"/>
            </svg>
          </a>
          <a href="/catalogo.html" class="btn btn--outline btn--full">
            Seguir comprando
          </a>

          <div class="order-summary__trust">
            <div class="order-summary__trust-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              Pago 100% seguro con MercadoPago
            </div>
            <div class="order-summary__trust-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
              Garantía de calidad en todos los productos
            </div>
            <div class="order-summary__trust-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
              </svg>
              Devoluciones sin complicaciones
            </div>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <!-- Footer -->
  <lilop-footer></lilop-footer>

  <!-- Scripts -->
  <script src="/assets/js/store.js?v=0a53486f"></script>
  <script src="/assets/js/router.js?v=8d0bfb43"></script>
  <script src="/assets/js/components/navbar.js?v=5d67e0cc"></script>
  <script src="/assets/js/components/footer.js?v=8f5f53e5"></script>
  <script src="/assets/js/components/cart.js?v=049c673d"></script>
  <script src="/assets/js/components/toast.js?v=ca49ca94"></script>
  <script src="/assets/js/pages/carrito.js?v=3976fa23"></script>

</body>
</html>
