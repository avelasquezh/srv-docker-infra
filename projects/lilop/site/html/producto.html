<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" id="metaDescription" content="Ropa de cama premium Lilop. Calidad certificada, entrega en todo Colombia." />
  <title id="pageTitle">Producto — Lilop</title>

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/global.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages/home.css" />
  <link rel="stylesheet" href="/assets/css/pages/producto.css" />
</head>
<body>

  <!-- Componentes globales -->
  <lilop-navbar></lilop-navbar>
  <lilop-cart></lilop-cart>
  <lilop-toast></lilop-toast>
  <div class="overlay" id="mainOverlay" aria-hidden="true"></div>

  <!-- ── BREADCRUMB ─────────────────────────────────────── -->
  <nav class="product-breadcrumb" aria-label="Ruta de navegación">
    <div class="container">
      <div class="product-breadcrumb__inner" id="productBreadcrumb">
        <a href="/index.html">Inicio</a>
        <span aria-hidden="true">›</span>
        <a href="/catalogo.html">Catálogo</a>
        <span aria-hidden="true">›</span>
        <span class="product-breadcrumb__current" id="breadcrumbProduct" aria-current="page">Cargando…</span>
      </div>
    </div>
  </nav>

  <!-- ── CONTENIDO PRINCIPAL — inyectado por producto.js ── -->
  <div class="container" id="productContainer">

    <!-- Skeleton mientras carga -->
    <div class="product-skeleton" id="productSkeleton" aria-hidden="true">
      <div class="product-skeleton__gallery">
        <div class="product-skeleton__main skeleton"></div>
        <div class="product-skeleton__thumbs">
          <div class="product-skeleton__thumb skeleton"></div>
          <div class="product-skeleton__thumb skeleton"></div>
          <div class="product-skeleton__thumb skeleton"></div>
        </div>
      </div>
      <div class="product-skeleton__info">
        <div class="product-skeleton__line skeleton" style="width:30%;height:14px;"></div>
        <div class="product-skeleton__line skeleton" style="width:80%;height:32px;margin-top:4px;"></div>
        <div class="product-skeleton__line skeleton" style="width:50%;height:32px;margin-top:8px;"></div>
        <div class="product-skeleton__line skeleton" style="width:100%;height:60px;margin-top:12px;"></div>
        <div class="product-skeleton__line skeleton" style="width:100%;height:48px;margin-top:8px;"></div>
        <div class="product-skeleton__line skeleton" style="width:100%;height:48px;"></div>
      </div>
    </div>

    <!-- Producto real — oculto hasta que cargue -->
    <div class="product-layout" id="productLayout" style="display:none;">

      <!-- GALERÍA -->
      <div class="product-gallery" role="region" aria-label="Galería de imágenes del producto">

        <div class="product-gallery__main" id="galleryMain" tabindex="0" aria-label="Imagen principal del producto">
          <img
            class="product-gallery__main-img"
            id="galleryMainImg"
            src=""
            alt=""
            loading="eager"
          />
          <div class="product-gallery__badge" id="galleryBadge"></div>
        </div>

        <div class="product-gallery__thumbs" id="galleryThumbs" role="list" aria-label="Miniaturas del producto">
          <!-- Inyectado por producto.js -->
        </div>

      </div>

      <!-- INFO -->
      <div class="product-info" id="productInfo">

        <p class="product-info__category" id="productCategory"></p>

        <h1 class="product-info__title" id="productTitle"></h1>

        <div class="product-info__rating" id="productRating" aria-label="Valoración del producto">
          <!-- Inyectado por producto.js -->
        </div>

        <div class="product-info__price-wrap" id="productPriceWrap">
          <!-- Inyectado por producto.js -->
        </div>

        <p class="product-info__short-desc" id="productShortDesc"></p>

        <!-- Variantes -->
        <div class="product-variants" id="productVariants" aria-label="Opciones del producto">
          <!-- Inyectado por producto.js -->
        </div>

        <!-- Acciones -->
        <div class="product-actions">
          <button
            class="product-actions__add"
            id="addToCartBtn"
            aria-label="Agregar al carrito"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
            Agregar al carrito
          </button>

          <a
            class="product-actions__whatsapp"
            id="whatsappBtn"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Consultar por WhatsApp"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
            Consultar por WhatsApp
          </a>
        </div>

        <!-- Notas de confianza -->
        <div class="product-trust" aria-label="Garantías de compra">
          <div class="product-trust__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round"/></svg>
            Envío gratis en pedidos mayores a $200.000
          </div>
          <div class="product-trust__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Pago 100% seguro con MercadoPago
          </div>
          <div class="product-trust__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Garantía de calidad certificada
          </div>
          <div class="product-trust__item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
            Devoluciones sin complicaciones
          </div>
        </div>

        <!-- Acordeón de detalles -->
        <div class="product-accordion" id="productAccordion" role="list">
          <!-- Inyectado por producto.js -->
        </div>

      </div>
    </div>

  </div>

  <!-- ── PRODUCTOS RELACIONADOS ──────────────────────────── -->
  <section class="related-products" id="relatedSection" aria-label="Productos relacionados" style="display:none;">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-eyebrow">También te puede gustar</span>
        <h2 class="section-title">Productos <em style="font-style:italic;color:var(--color-violet)">relacionados</em></h2>
      </div>
      <div class="related-products__grid" id="relatedGrid" role="list">
        <!-- Inyectado por producto.js -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <lilop-footer></lilop-footer>

  <!-- Scripts -->
  <script src="/assets/js/store.js"></script>
  <script src="/assets/js/router.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script src="/assets/js/components/footer.js"></script>
  <script src="/assets/js/components/cart.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/pages/producto.js"></script>

</body>
</html>
