services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data:/data
    networks:
      - autokore-backend-network
      - lilop-backend-network

networks:
  autokore-backend-network:
    external: true
  lilop-backend-network:
    external: true
